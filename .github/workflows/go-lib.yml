---
name: go-lib

on:
  pull_request:
  push:
    branches: [main, master, production]

permissions:
  actions: none
  checks: none
  contents: read
  deployments: none
  discussions: none
  id-token: none
  issues: none
  packages: none
  pages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  go-checks:
    # Public repositories cannot call the private remerge/workflows repository.
    # Keep the generation, lint and race gates local and credential-free.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
      - name: Verify generated sources
        run: make gen && git diff --exit-code --name-only HEAD
      - name: Lint
        run: make lint
      - name: Test with race detector
        run: make race-nocache
